<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Manrope, Arial, sans-serif">
  <title>Seat map: Neon Arcadia World Tour, Istora Senayan</title>
  <rect width="800" height="1000" fill="#0B0B0E"/>

  <!-- Stage and catwalk -->
  <rect x="190" y="60" width="420" height="90" rx="10" fill="#2A2935"/>
  <text x="400" y="113" text-anchor="middle" fill="#F5F3EF" font-size="26" font-weight="700" letter-spacing="6">STAGE</text>
  <rect x="370" y="150" width="60" height="170" fill="#2A2935"/>
  <circle cx="400" cy="335" r="42" fill="#2A2935"/>

  <!-- VIP Standing pit around the catwalk -->
  <path d="M150 170 H360 V300 A60 60 0 0 0 340 360 H150 Z" fill="#C6FF3D"/>
  <path d="M650 170 H440 V300 A60 60 0 0 1 460 360 H650 Z" fill="#C6FF3D"/>
  <text x="250" y="270" text-anchor="middle" fill="#0B0B0E" font-size="22" font-weight="800">VIP STANDING A</text>
  <text x="550" y="270" text-anchor="middle" fill="#0B0B0E" font-size="22" font-weight="800">VIP STANDING B</text>

  <!-- Barrier -->
  <path d="M140 395 H660" stroke="#F5F3EF" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Festival floor -->
  <rect x="150" y="410" width="245" height="250" rx="8" fill="#FF3DA6"/>
  <rect x="405" y="410" width="245" height="250" rx="8" fill="#FF3DA6"/>
  <text x="272" y="540" text-anchor="middle" fill="#0B0B0E" font-size="24" font-weight="800">FESTIVAL A</text>
  <text x="527" y="540" text-anchor="middle" fill="#0B0B0E" font-size="24" font-weight="800">FESTIVAL B</text>

  <!-- Front of house -->
  <rect x="355" y="600" width="90" height="50" rx="6" fill="#2A2935"/>
  <text x="400" y="632" text-anchor="middle" fill="#F5F3EF" font-size="16" font-weight="700">FOH</text>

  <!-- Side and back aisles, entrances -->
  <rect x="60" y="170" width="70" height="490" rx="8" fill="#1E1D26"/>
  <rect x="670" y="170" width="70" height="490" rx="8" fill="#1E1D26"/>
  <text x="95" y="420" text-anchor="middle" fill="#8D8A99" font-size="15" font-weight="700" transform="rotate(-90 95 420)">GATE 1 · ENTRY</text>
  <text x="705" y="420" text-anchor="middle" fill="#8D8A99" font-size="15" font-weight="700" transform="rotate(90 705 420)">GATE 2 · ENTRY</text>

  <!-- Legend -->
  <rect x="60" y="720" width="680" height="230" rx="20" fill="#16151C"/>
  <text x="100" y="770" fill="#F5F3EF" font-size="20" font-weight="800" letter-spacing="3">STANDING AREAS</text>
  <rect x="100" y="800" width="28" height="28" rx="6" fill="#C6FF3D"/>
  <text x="145" y="813" fill="#F5F3EF" font-size="18" font-weight="700">VIP Standing A, B</text>
  <text x="145" y="836" fill="#8D8A99" font-size="16">$120 · closest to the catwalk</text>
  <rect x="100" y="865" width="28" height="28" rx="6" fill="#FF3DA6"/>
  <text x="145" y="878" fill="#F5F3EF" font-size="18" font-weight="700">Festival A, B</text>
  <text x="145" y="901" fill="#8D8A99" font-size="16">$65 · Early Bird tickets also use this area</text>
  <text x="440" y="813" fill="#F5F3EF" font-size="18" font-weight="700">Wheelchair access</text>
  <text x="440" y="836" fill="#8D8A99" font-size="16">Platform behind Festival B, via Gate 2</text>
  <text x="440" y="878" fill="#F5F3EF" font-size="18" font-weight="700">Not to scale</text>
  <text x="440" y="901" fill="#8D8A99" font-size="16">Layout may change slightly on the day</text>
</svg>
