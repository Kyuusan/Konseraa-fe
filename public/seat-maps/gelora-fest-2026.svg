<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Manrope, Arial, sans-serif">
  <title>Seat map: Gelora Fest 2026, GOR Saparua</title>
  <rect width="800" height="1000" fill="#0B0B0E"/>

  <!-- Stage -->
  <path d="M220 60 H580 L620 150 H180 Z" fill="#2A2935"/>
  <text x="400" y="118" text-anchor="middle" fill="#F5F3EF" font-size="26" font-weight="700" letter-spacing="6">MAIN STAGE</text>

  <!-- Regular field -->
  <path d="M190 175 H610 L680 560 H120 Z" fill="#FF3DA6"/>
  <text x="400" y="360" text-anchor="middle" fill="#0B0B0E" font-size="30" font-weight="800">REGULAR FIELD</text>
  <text x="400" y="395" text-anchor="middle" fill="#0B0B0E" font-size="18" font-weight="700">Standing · Group of 4 enters here too</text>

  <!-- Raised VIP decks on both sides -->
  <rect x="40" y="200" width="120" height="250" rx="10" fill="#C6FF3D"/>
  <rect x="640" y="200" width="120" height="250" rx="10" fill="#C6FF3D"/>
  <text x="100" y="325" text-anchor="middle" fill="#0B0B0E" font-size="20" font-weight="800" transform="rotate(-90 100 325)">VIP DECK WEST</text>
  <text x="700" y="325" text-anchor="middle" fill="#0B0B0E" font-size="20" font-weight="800" transform="rotate(90 700 325)">VIP DECK EAST</text>

  <!-- Mixing desk -->
  <rect x="350" y="470" width="100" height="50" rx="6" fill="#2A2935"/>
  <text x="400" y="502" text-anchor="middle" fill="#F5F3EF" font-size="16" font-weight="700">FOH</text>

  <!-- Food court and gate -->
  <rect x="120" y="590" width="560" height="60" rx="10" fill="#1E1D26"/>
  <text x="400" y="627" text-anchor="middle" fill="#8D8A99" font-size="17" font-weight="700" letter-spacing="2">FOOD COURT · MERCH · TOILETS</text>
  <rect x="330" y="665" width="140" height="34" rx="17" fill="#1E1D26"/>
  <text x="400" y="688" text-anchor="middle" fill="#F5F3EF" font-size="15" font-weight="700">MAIN GATE</text>

  <!-- Legend -->
  <rect x="60" y="730" width="680" height="220" rx="20" fill="#16151C"/>
  <text x="100" y="780" fill="#F5F3EF" font-size="20" font-weight="800" letter-spacing="3">AREAS</text>
  <rect x="100" y="810" width="28" height="28" rx="6" fill="#C6FF3D"/>
  <text x="145" y="823" fill="#F5F3EF" font-size="18" font-weight="700">VIP Deck West, East</text>
  <text x="145" y="846" fill="#8D8A99" font-size="16">$70 · raised view, own bar</text>
  <rect x="100" y="875" width="28" height="28" rx="6" fill="#FF3DA6"/>
  <text x="145" y="888" fill="#F5F3EF" font-size="18" font-weight="700">Regular field</text>
  <text x="145" y="911" fill="#8D8A99" font-size="16">$30 · Group of 4 ($100) uses this area</text>
  <text x="460" y="823" fill="#F5F3EF" font-size="18" font-weight="700">Outdoor venue</text>
  <text x="460" y="846" fill="#8D8A99" font-size="16">Rain or shine</text>
  <text x="460" y="888" fill="#F5F3EF" font-size="18" font-weight="700">Not to scale</text>
  <text x="460" y="911" fill="#8D8A99" font-size="16">Layout may change slightly</text>
</svg>
